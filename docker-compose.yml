# Fallback etcd for machines without a native `etcd` binary.
# Usage: docker compose up -d etcd && make demo ETCD_BIN=
services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.15
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - "127.0.0.1:2379:2379"
